name: Check

# scripts/check (lock, ruff, format, pyright, pytest) on every push and PR.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: trixie
    timeout-minutes: 20
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.13.3"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - name: uv (checksum-verified release)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          tgz=uv-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}"
          curl -fsSLO "${base}/${tgz}" && curl -fsSLO "${base}/${tgz}.sha256"
          sha256sum -c "${tgz}.sha256"
          tar -xzf "${tgz}" --strip-components=1 -C /usr/local/bin uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx

      - name: Build tools (pycares has no Python 3.14 wheel and builds with CMake)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake >/dev/null

      - name: Python and dev dependencies (from uv.lock)
        run: uv sync --frozen

      - name: scripts/check
        run: scripts/check
