name: Check

# Every push to main and every PR runs four independent gates:
# - check: scripts/check (lock, ruff, format, pyright, pytest with a coverage floor)
# - compat: the full test suite against the advertised Home Assistant minimum (hacs.json)
# - hassfest: Home Assistant's integration validator, from Core at the pinned version
# - secrets: a Gitleaks scan of the full history
# HACS validation needs the public GitHub repository, so it runs there
# (.github/workflows/validate.yml) rather than here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Branch pushes are checked through their PR, so each push runs once; a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.9"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  check:
    runs-on: trixie
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: uv (checksum-verified release)
        run: scripts/ci-install-uv

      - name: Build tools (pycares has no Python 3.14 wheel and builds with CMake)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake >/dev/null

      - name: Python and dev dependencies (from uv.lock)
        run: uv sync --frozen

      - name: scripts/check
        run: scripts/check

  compat:
    runs-on: trixie
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: uv (checksum-verified release)
        run: scripts/ci-install-uv

      - name: Build tools (pycares has no Python 3.14 wheel and builds with CMake)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake >/dev/null

      - name: Test suite on the advertised Home Assistant minimum
        run: scripts/check_ha_compat.sh

  hassfest:
    runs-on: trixie
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: uv (checksum-verified release)
        run: scripts/ci-install-uv

      - name: Build tools (git for the Core checkout; CMake for pycares)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake git >/dev/null

      - name: hassfest
        run: scripts/hassfest

  secrets:
    runs-on: trixie
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "v8.30.1"
    steps:
      - name: git (the scan reads history, so checkout must produce a real clone)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (checksum-verified release)
        run: |
          set -euo pipefail
          version=${GITLEAKS_VERSION#v}
          cd "$(mktemp -d)"
          tgz="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${tgz}" && curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep " ${tgz}\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${tgz}" -C /usr/local/bin gitleaks

      # actions/checkout silently falls back to a tarball without git, and a shallow
      # clone would scan one commit; either would let the scan pass vacuously.
      - name: Require a full clone
        run: |
          set -euo pipefail
          git rev-parse --is-inside-work-tree >/dev/null
          test "$(git rev-parse --is-shallow-repository)" = false
          echo "Scanning $(git rev-list --count --all) commits"

      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - name: Scan the full history
        run: gitleaks git --redact --no-banner --exit-code 1 .
