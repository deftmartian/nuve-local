[project]
name = "nuve-local"
version = "0.0.5"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  # Keep in step with homeassistant: it pins cryptography exactly, so a newer
  # release makes the lock unsatisfiable. Raise only with a homeassistant bump.
  "cryptography==50.0.2",
  "homeassistant==2026.11.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "C90", "DTZ", "E", "F", "G", "I", "LOG", "PERF", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC109", "ASYNC240", "RUF012"]

[tool.pyright]
include = ["custom_components/nuve_local"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
# HA entity properties are cached_property; integrations override them with plain properties.
reportIncompatibleVariableOverride = false
